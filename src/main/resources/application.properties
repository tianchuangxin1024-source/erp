spring.application.name=erp
server.port=8080
spring.profiles.active=dev

# 数据源配置（MariaDB）
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=jdbc:mariadb://localhost:3306/tian?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8mb4
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# MyBatis-Plus 配置
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.global-config.db-config.id-type=auto
# 财务模块使用显式 SQL 初始化。部署时可预先执行同一脚本。
spring.sql.init.schema-locations=classpath:db/finance-schema.sql
spring.sql.init.mode=${ERP_SCHEMA_INIT:never}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
spring.sql.init.encoding=UTF-8

# OpenAPI 使用文档及交互调试入口
springdoc.packages-to-scan=com.tian.erp.controller
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=false
springdoc.override-with-generic-response=false

# 本机凭据文件不提交至版本库
spring.config.import=optional:classpath:application-local.properties
